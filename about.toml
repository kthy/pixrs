# Licenses of the crates compiled into pixrs, for `THIRD_PARTY_NOTICES.txt` (`just notices`).
# Every license here must be compatible with the AGPL-3.0.
# The first of these a crate offers is used, so short permissive texts come first.
accepted = [
    "0BSD",
    "MIT",
    "ISC",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring"]

# pixrs itself (`publish = false`).
[private]
ignore = true

# nom-exif has a `license-file` instead of a license expression.
[nom-exif.clarify]
license = "MIT"

[[nom-exif.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "9cfbbedc535b1a4b73b2f7f51fd683ac6cae914f6d4bc7f271b9b230dd4e2808"
