sonar.organization=kthy
sonar.projectKey=kthy_pixrs
sonar.projectName=pixrs

# Tests live next to the code they test, in the same files.
sonar.sources=src,examples,build.rs
sonar.exclusions=src/serve/assets/htmx-*.min.js
sonar.coverage.exclusions=examples/**,build.rs

# Written by the SonarQube Cloud job in .github/workflows/ci.yml.
sonar.rust.lcov.reportPaths=target/lcov.info
sonar.rust.clippyReport.reportPaths=target/clippy.json
