[package]
name = "pixrs"
version = "0.2.0"
authors = ["Kristian Thy <thy@42.dk>"]
edition = "2021"
description = "A command-line program to manage your media files"
repository = "https://github.com/kthy/pixrs/"
license = "AGPL-3.0-or-later"
keywords = [
    "audio",
    "gallery",
    "image",
    "photo",
    "video",
]
categories = [
    "command-line-utilities",
    "multimedia::audio",
    "multimedia::images",
    "multimedia::video",
    "visualization",
]
publish = false

[dependencies]
axum = "0.8"                                                                                         # MIT
clap = { version = "4", features = ["derive", "wrap_help"] }                                         # MIT OR Apache-2.0
ctrlc = { version = "3", features = ["termination"] }                                                # MIT OR Apache-2.0
data-encoding = "2"                                                                                  # MIT
directories = "6"                                                                                    # MIT OR Apache-2.0
env_logger = "0.11"                                                                                  # MIT OR Apache-2.0
exitcode = "1"                                                                                       # Apache-2.0
image_hasher = "3"                                                                                   # MIT OR Apache-2.0
indicatif = "0.18"                                                                                   # MIT
log = "0.4"                                                                                          # MIT OR Apache-2.0
maud = "0.27"                                                                                        # MIT OR Apache-2.0
nom-exif = "3"                                                                                       # MIT
open = "5"                                                                                           # MIT
ring = "0.17"                                                                                        # It's complicated
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }                             # MIT (bundled SQLite is public domain)
same-file = "1"                                                                                      # Unlicense OR MIT
serde = { version = "1", features = ["derive"] }                                                     # MIT OR Apache-2.0
serde_json = "1"                                                                                     # MIT OR Apache-2.0
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }                      # MIT OR Apache-2.0
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] } # MIT
tower = { version = "0.5", features = ["util"] }                                                     # MIT
tower-http = { version = "0.7", features = ["fs"] }                                                  # MIT
unicode-normalization = "0.1"                                                                        # (MIT OR Apache-2.0) AND Unicode-3.0
urlencoding = "2"                                                                                    # MIT
walkdir = "2"                                                                                        # Unlicense OR MIT

[dependencies.image] # MIT OR Apache-2.0
version = "0.25"
default-features = false
features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"]

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# The library exists for the binary, examples and tests; it has no outside users to document
# errors for or to warn about ignored results.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Templates and suffixes are plain strings with `{token}` placeholders that pixrs fills itself.
literal_string_with_formatting_args = "allow"
# An `if let ... else` chain reads better here than the `map_or_else` closures it asks for.
option_if_let_else = "allow"
# Doc comments open with a full paragraph; the crate publishes no rustdoc item summaries.
too_long_first_doc_paragraph = "allow"
# Pairs like `moving`/`moved` and `fault`/`faulty` name related things on purpose.
similar_names = "allow"
# Production code must not panic on bad input: no unwrap, expect, panic or slice indexing outside
# tests (clippy.toml allows them in tests). A site that cannot fail by construction says why in
# a narrow `#[expect]`.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
