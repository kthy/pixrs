[package]
name = "pixrs"
version = "0.2.0"
authors = ["Kristian Thy <thy@42.dk>"]
edition = "2021"
description = "A command-line program to manage your media files"
repository = "https://github.com/kthy/pixrs/"
license = "AGPL-3.0-or-later"
keywords = [
    "audio",
    "gallery",
    "image",
    "photo",
    "video",
]
categories = [
    "command-line-utilities",
    "multimedia::audio",
    "multimedia::images",
    "multimedia::video",
    "visualization",
]
publish = false

[dependencies]
axum = "0.8"                                                                                         # MIT
clap = { version = "4", features = ["derive", "wrap_help"] }                                         # MIT OR Apache-2.0
ctrlc = { version = "3", features = ["termination"] }                                                # MIT OR Apache-2.0
data-encoding = "2"                                                                                  # MIT
directories = "6"                                                                                    # MIT OR Apache-2.0
env_logger = "0.11"                                                                                  # MIT OR Apache-2.0
exitcode = "1"                                                                                       # Apache-2.0
image_hasher = "3"                                                                                   # MIT OR Apache-2.0
indicatif = "0.18"                                                                                   # MIT
log = "0.4"                                                                                          # MIT OR Apache-2.0
maud = "0.27"                                                                                        # MIT OR Apache-2.0
nom-exif = "3"                                                                                       # MIT
open = "5"                                                                                           # MIT
ring = "0.17"                                                                                        # It's complicated
rusqlite = { version = "0.40", features = ["bundled"] }                                              # MIT (bundled SQLite is public domain)
same-file = "1"                                                                                      # Unlicense OR MIT
serde = { version = "1", features = ["derive"] }                                                     # MIT OR Apache-2.0
serde_json = "1"                                                                                     # MIT OR Apache-2.0
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }                      # MIT OR Apache-2.0
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] } # MIT
tower = { version = "0.5", features = ["util"] }                                                     # MIT
tower-http = { version = "0.7", features = ["fs"] }                                                  # MIT
urlencoding = "2"                                                                                    # MIT
walkdir = "2"                                                                                        # Unlicense OR MIT

[dependencies.image] # MIT OR Apache-2.0
version = "0.25"
default-features = false
features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"]

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
