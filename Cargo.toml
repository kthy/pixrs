[package]
name = "pixrs"
version = "0.1.0"
authors = ["Kristian Thy <k@pyxy.dk>"]
edition = "2021"
description = "A command-line program to display a bunch of photographs in a reasonable manner"
repository = "https://github.com/pyxy-dk/pixrs/"
license = "AGPL-3.0-or-later"
keywords = [
    "exif",
    "gallery",
    "photo",
    "picture",
]
categories = [
    "command-line-utilities",
    "multimedia::images",
    "multimedia::video",
    "template-engine",
    "visualization",
]
publish = false

[dependencies]
anyhow = "1.0"          # MIT OR Apache-2.0
env_logger = "0.9"      # MIT OR Apache-2.0
exitcode = "1.1"        # Apache-2.0
glob = "0.3"            # MIT OR Apache-2.0
indicatif = "0.16"      # MIT
kamadak-exif = "0.5.4"  # BSD-2-Clause
log = "0.4"             # MIT OR Apache-2.0
maud = "0.23"           # MIT OR Apache-2.0
structopt = "0.3"       # MIT OR Apache-2.0
