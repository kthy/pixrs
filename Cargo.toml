[package]
name = "pixrs"
version = "0.1.0"
authors = ["Kristian Thy <k@pyxy.dk>"]
edition = "2021"
description = "A command-line program to display a bunch of photographs in a reasonable manner"
repository = "https://github.com/pyxy-dk/pixrs/"
license = "AGPL-3.0-or-later"
keywords = [
    "exif",
    "gallery",
    "photo",
    "picture",
]
categories = [
    "command-line-utilities",
    "multimedia::images",
    "multimedia::video",
    "template-engine",
    "visualization",
]
publish = false

[dependencies]
anyhow = "1.0"
env_logger = "0.9"
indicatif = "0.16"
log = "0.4"
structopt = "0.3"
