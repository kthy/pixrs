name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      # Offline, as `just notices` runs it, so license texts come from the crates alone.
      - run: cargo fetch --locked
      - run: cargo about generate --frozen --fail -o "$RUNNER_TEMP/notices.txt" about.hbs
      - name: Check that THIRD_PARTY_NOTICES.txt is current
        run: |
          diff -u THIRD_PARTY_NOTICES.txt "$RUNNER_TEMP/notices.txt" \
            || { echo "::error::THIRD_PARTY_NOTICES.txt is out of date: run just notices"; exit 1; }

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      # So the tests that need ffmpeg and fpcalc run on at least one OS.
      - name: Install ffmpeg and fpcalc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg libchromaprint-tools
      # Tests that need ffmpeg skip themselves without it; this shows which case applies.
      - name: Show ffmpeg and fpcalc versions
        shell: bash
        run: |
          if command -v ffmpeg > /dev/null; then
            ffmpeg -version | sed -n 1p
          else
            echo "ffmpeg is not on PATH: the tests that need it skip"
          fi
          if command -v fpcalc > /dev/null; then
            fpcalc -version
          else
            echo "fpcalc is not on PATH: the tests that need it skip"
          fi
      - run: cargo test
